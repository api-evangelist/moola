aid: moola
name: Moola
description: >-
  Moola Market is a non-custodial, decentralized liquidity protocol on the Celo
  blockchain that democratizes access to yield and credit. Depositors earn
  compound interest that is paid by borrowers who take out over-collateralized
  loans, delegated loans, or flash loans. The protocol shares ancestry with the
  Aave v2 codebase, is open source and independently audited, and issues
  interest-bearing mTokens (mcUSD, mcEUR, mcREAL, mCELO) redeemable one-to-one
  for the underlying Celo stable assets. Moola is a smart-contract protocol
  rather than an HTTP API: developers integrate by calling on-chain contracts
  (deposit, withdraw, borrow, repay, flash loan) from a supported wallet. Backed
  by Polychain Capital.
